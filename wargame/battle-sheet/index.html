<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pokémon Wargame — Fiches de combat</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<header>
  <h1>Pokémon Wargame</h1>
  <p>Créateur de fiches de combat — V1</p>
  <nav class="top-nav">
    <a class="active" href="index.html">⚔️ Fiche de combat</a>
    <a href="../capacities/index.html">✨ Capacités</a>
    <a href="../sheets/index.html">📊 Google Sheets</a>
  </nav>
</header>
<main>
  <section>
    <div class="section-title">
      <h2>Mon équipe</h2>
      <div class="counter" id="teamCounter">1 / 6 Pokémon</div>
    </div>
    <div class="team" id="team"></div>
    <div class="actions">
      <button class="add-btn" id="addPokemon">＋ Ajouter un Pokémon</button>
      <button class="export-btn" id="exportImage" type="button">🖼️ Télécharger la fiche en PNG</button>
    </div>
  </section>
  <section class="attack-panel">
    <h2>Capacités disponibles</h2>
    <p class="hint" id="attackHint">Chargement des capacités depuis Google Sheets…</p>
    <div class="available" id="availableAttacks"></div>
  </section>
</main>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<script src="script.js?v=4"></script>
</body>
</html>
